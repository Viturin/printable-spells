services:
  spellcards-app:
    image: spellcards-app:local
    build:
      context: .
      dockerfile: spellcards-app/Dockerfile
    environment:
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Run ../dev-workspace/bin/init-workspace first}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run ../dev-workspace/bin/init-workspace first}
      SPELLCARDS_QUEUE_NAME: spellcards.pdf.jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  spellcards-worker:
    image: spellcards-worker:local
    build:
      context: .
      dockerfile: spellcards-worker/Dockerfile
    environment:
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Run ../dev-workspace/bin/init-workspace first}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run ../dev-workspace/bin/init-workspace first}
      SPELLCARDS_QUEUE_NAME: spellcards.pdf.jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  spellcards-web:
    image: spellcards-web:local
    build:
      context: .
      dockerfile: spellcards-web/Dockerfile
    depends_on:
      - spellcards-app
    restart: unless-stopped
