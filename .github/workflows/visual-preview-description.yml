name: Update visual preview description

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: visual-preview-description
  queue: max

jobs:
  update-description:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run uses the default branch SHA. Close events use the
          # default branch explicitly, regardless of the PR target branch.
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/heads/{0}', github.event.repository.default_branch) || github.sha }}
          persist-credentials: false

      - name: Publish screenshots and update the visual preview section
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/visual-preview-description.py
