name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: staging
      rollback_tag:
        description: "Optional existing image tag to deploy (for rollback), e.g. sha-abc123def456"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  resolve-image:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      ghcr_owner: ${{ steps.resolve.outputs.ghcr_owner }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          rollback_tag="${{ inputs.rollback_tag }}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${rollback_tag}" ]]; then
            echo "image_tag=${rollback_tag}" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Images
    needs: resolve-image
    if: ${{ needs.resolve-image.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./spellcards-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-app:${{ needs.resolve-image.outputs.image_tag }}
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./spellcards-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-web:${{ needs.resolve-image.outputs.image_tag }}
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-web:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./spellcards-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-worker:${{ needs.resolve-image.outputs.image_tag }}
            ghcr.io/${{ needs.resolve-image.outputs.ghcr_owner }}/spellcards-worker:latest

  dispatch-staging:
    name: Deploy and Verify Staging
    needs:
      - resolve-image
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    if: >-
      !cancelled() &&
      needs.resolve-image.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'push' || inputs.deploy_target == 'staging' || inputs.deploy_target == 'both')
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMELAB_OPS_DISPATCH_TOKEN }}
          repository: Viturin/homelab-ops
          event-type: deploy-stack
          client-payload: >-
            {
              "stack": "spellcards",
              "environment": "staging",
              "request_id": "${{ env.REQUEST_ID }}",
              "env_lines": "APP_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}\nWEB_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}\nWORKER_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}"
            }

      - name: Wait for the matching homelab deploy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_OPS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          workflow_runs='repos/Viturin/homelab-ops/actions/workflows/deploy.yml/runs'
          run_title="Spell Cards staging $REQUEST_ID"
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if ! run="$(gh api --method GET "$workflow_runs" -f event=repository_dispatch -f per_page=50 |
              jq -c --arg title "$run_title" '.workflow_runs[] | select(.display_title == $title)')"; then
              echo "Could not read homelab workflow runs. Check Actions read access on HOMELAB_OPS_DISPATCH_TOKEN." >&2
              exit 1
            fi
            if [[ -n "$run" ]] && jq -e '.status == "completed"' <<< "$run" > /dev/null; then
              jq -r '.html_url' <<< "$run"
              if jq -e '.conclusion == "success"' <<< "$run" > /dev/null; then
                exit 0
              fi
              echo "Staging deployment failed its checks or did not complete successfully." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the staging deployment $REQUEST_ID." >&2
          exit 1

  dispatch-production:
    name: Dispatch Production Deploy
    needs:
      - resolve-image
      - build-and-push
      - dispatch-staging
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      needs.resolve-image.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (
        ((github.event_name == 'push' || inputs.deploy_target == 'both') &&
          needs.dispatch-staging.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production')
      )
    environment:
      name: production
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMELAB_OPS_DISPATCH_TOKEN }}
          repository: Viturin/homelab-ops
          event-type: deploy-stack
          client-payload: >-
            {
              "stack": "spellcards",
              "environment": "production",
              "env_lines": "APP_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}\nWEB_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}\nWORKER_IMAGE_TAG=${{ needs.resolve-image.outputs.image_tag }}"
            }
