openapi: 3.0.3
info:
  title: Printable Spells API
  version: 0.1.0
  description: API contract for finding PF2e spells and generating spell cards.

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/spells/search:
    get:
      tags:
        - Spells
      operationId: searchSpells
      summary: Fuzzy search spells
      description: >-
        Returns spell summaries ranked by fuzzy match score for the provided query.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text.
          schema:
            type: string
            minLength: 1
            example: daze
        - name: kind
          in: query
          required: false
          description: Optional spell kind filter.
          schema:
            $ref: '#/components/schemas/SpellKind'
        - name: limit
          in: query
          required: false
          description: Max number of results to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous response.
          schema:
            type: string
      responses:
        '200':
          description: Spell search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellSearchResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/spells/resolve:
    post:
      tags:
        - Spells
      operationId: resolveSpellNames
      summary: Resolve exact spell names in bulk
      description: Matches names case-insensitively, in input order, and reports unmatched names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSpellNamesRequest'
      responses:
        '200':
          description: Matched spells and unmatched names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveSpellNamesResponse'
        '400':
          description: Invalid list of spell names.
  /api/v1/spellcards/jobs:
    post:
      tags:
        - SpellCardJobs
      operationId: createSpellCardJob
      summary: Queue spell card generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpellCardJobRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpellCardJobResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Unable to queue the job or confirm that it was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/spellcards/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/SpellCardJobId'
    get:
      tags:
        - SpellCardJobs
      operationId: getSpellCardJob
      summary: Get the status of a spell card job
      responses:
        '200':
          description: Current job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellCardJobResponse'
        '404':
          $ref: '#/components/responses/SpellCardJobNotFound'

  /api/v1/spellcards/jobs/{jobId}/pdf:
    parameters:
      - $ref: '#/components/parameters/SpellCardJobId'
    get:
      tags:
        - SpellCardJobs
      operationId: downloadSpellCardJobPdf
      summary: Download or preview a completed spell card PDF
      parameters:
        - name: inline
          in: query
          description: Serve the PDF for inline viewing instead of as a download.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Completed spell cards PDF.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="spellcards.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/SpellCardJobNotFound'
        '409':
          description: The job has not completed or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The job has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Spells
    description: Spell search operations
  - name: SpellCardJobs
    description: Asynchronous spell card generation and downloads

components:
  parameters:
    SpellCardJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SpellCardJobNotFound:
      description: The job does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SpellKind:
      type: string
      enum:
        - SPELL
        - FOCUS
        - RITUAL

    SpellRarity:
      type: string
      enum:
        - common
        - uncommon
        - rare
        - unique

    SpellSummary:
      type: object
      required:
        - id
        - name
        - level
        - kind
        - rarity
        - traditions
        - traits
        - score
      properties:
        id:
          type: string
          example: r3NeUnsgt9mS03Sn
        name:
          type: string
          example: Daze
        level:
          type: integer
          format: int32
          minimum: 0
          example: 1
        kind:
          $ref: '#/components/schemas/SpellKind'
        rarity:
          $ref: '#/components/schemas/SpellRarity'
        traditions:
          type: array
          items:
            type: string
          example:
            - arcane
            - occult
        traits:
          type: array
          items:
            type: string
          example:
            - cantrip
            - rank-1
        actionCost:
          type: string
          description: example, 1, 2, reaction, 1 day.
          example: '2'
        range:
          type: string
          example: 60 feet
        target:
          type: string
          example: 1 creature
        description:
          type: string
          example: You cloud the target's mind and daze it with a mental jolt.
        cardPreview:
          $ref: '#/components/schemas/SpellCardPreview'
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Normalized fuzzy match score.
          example: 0.97

    SpellCardPreview:
      type: object
      required: [classification, rules]
      properties:
        classification:
          type: string
        action:
          $ref: '#/components/schemas/SpellCardActionBadge'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SpellCardRule'

    SpellCardActionBadge:
      type: object
      required: [symbols, caption]
      properties:
        symbols:
          type: string
        caption:
          type: string

    SpellCardRule:
      type: object
      required: [label, value]
      properties:
        symbol:
          type: string
          description: Compact monochrome symbol that identifies this card rule.
        label:
          type: string
        value:
          type: string

    SpellSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpellSummary'
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page, null when no more results.
          example: eyJvZmZzZXQiOjIwfQ==

    ResolveSpellNamesRequest:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          example: [Daze, Heal]

    ResolveSpellNamesResponse:
      type: object
      required:
        - items
        - unmatchedNames
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpellSummary'
        unmatchedNames:
          type: array
          items:
            type: string

    CreateSpellCardJobRequest:
      type: object
      required:
        - spellNames
      properties:
        spellNames:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          example:
            - Daze
            - Magic Missile
        layout:
          $ref: '#/components/schemas/SpellCardPdfLayout'

    SpellCardPdfLayout:
      type: string
      description: Playing-card pages or A4 cut sheets, with optional front and back pages arranged for long-edge duplex printing.
      default: A4_SHEET
      enum:
        - A4_SHEET
        - PLAYING_CARD
        - A4_DUPLEX
        - PLAYING_CARD_DUPLEX

    SpellCardJobStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
        - EXPIRED

    SpellCardJobResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SpellCardJobStatus'
        downloadUrl:
          type: string
          description: Same-origin PDF path, available when COMPLETED.
        errorMessage:
          type: string
          description: User-facing error, available when FAILED.

    CreateSpellCardJobResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SpellCardJobStatus'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_ARGUMENT
        message:
          type: string
          example: query parameter 'q' must not be blank
        details:
          type: array
          items:
            type: string
          example:
            - q must have at least 1 character
