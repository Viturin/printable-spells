spellcards.queue.name=${SPELLCARDS_QUEUE_NAME:spellcards.pdf.jobs}
spellcards.jobs.artifact-dir=${SPELLCARDS_ARTIFACT_DIR:runtime/spellcard-jobs}
spellcards.jobs.retention-hours=${SPELLCARDS_ARTIFACT_RETENTION_HOURS:24}
spellcards.jobs.manifest-retention-days=${SPELLCARDS_JOB_MANIFEST_RETENTION_DAYS:7}
spellcards.jobs.cleanup-interval-ms=${SPELLCARDS_JOB_CLEANUP_INTERVAL_MS:3600000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
